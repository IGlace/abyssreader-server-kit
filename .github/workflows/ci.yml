#
# The kit's public CI: unit tests and the OpenAPI checks against contract/.
# The private app conformance suite is a separate release gate.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Unit tests and contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.4'
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          [ -z "$unformatted" ] || { echo "not gofmt'ed:"; echo "$unformatted"; exit 1; }
      - name: Build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      # internal/api's tests hold every answer of the account routes and /api/status to
      # contract/openapi.yaml (strict schema, declared statuses, the contract's error codes).
      - name: go test (with the race detector)
        run: go test -race -count=1 ./...
      - name: Operator help matches the CLI and published paths
        run: |
          go build -o "$RUNNER_TEMP/abyssreader-server" ./cmd/abyssreader-server
          python3 scripts/operator-docs.py check "$RUNNER_TEMP/abyssreader-server"
          python3 scripts/test-operator-docs.py
          python3 scripts/test-operator-hook.py
          sh scripts/test-operator-workspace.sh
      - name: Generated catalog feed manifest validates and imports
        run: go test -count=1 ./examples/catalog-feed
      # Every examples/**/manifest.json against schemas/import-manifest.schema.json.
      - name: Example import manifests match the schema
        run: go test -count=1 -run 'TestEveryExampleManifestMatchesTheSchema' ./schemas/
      # The image build makes the same file; this step fails on a GPL, LGPL, AGPL or SSPL module.
      - name: Third-party notices (licence gate)
        run: go run ./scripts/notices -o THIRD_PARTY_NOTICES ./cmd/abyssreader-server
      # Third-party action pinned by commit (v4.0.0).
      - uses: sqlc-dev/setup-sqlc@c0209b9199cd1cce6a14fc27cabcec491b651761
        with:
          sqlc-version: '1.31.1'
      - name: Generated queries match sqlc
        run: sqlc diff
      - name: Licence headers
        run: scripts/check-licence-headers.sh
      - name: Release notes include all upcoming support dates
        run: sh scripts/test-release-notes.sh

  contract:
    name: Contract lint and examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install locked validator dependencies
        run: |
          npm ci --prefix scripts/contract --ignore-scripts --no-audit --no-fund
          python -m pip install --require-hashes --no-deps -r scripts/contract/requirements.txt
      - name: Lint OpenAPI with Redocly
        working-directory: contract
        run: ../scripts/contract/node_modules/.bin/redocly lint openapi.yaml
      - name: Validate OpenAPI and every example and test the validator
        run: |
          python scripts/contract/validate_server_contract.py
          python scripts/contract/validate_server_contract.py --self-test
          python -m unittest discover -s scripts/contract -p test_definition_hosts.py

  image:
    name: Image builds and runs (simple setup)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build the image
        run: docker build --build-arg VERSION=ci -t abyssreader-server-kit:ci .
      - name: Start it with a /data volume and wait until healthy
        run: |
          docker run -d --name kit -p 127.0.0.1:8080:8080 -v kitdata:/data --read-only --tmpfs /tmp \
            -v "$PWD/examples/manifests:/import:ro" \
            -e ABYSS_SERVER_NAME="CI server" -e ABYSS_OPERATOR_NAME="CI" \
            -e ABYSS_OPERATOR_CONTACT="mailto:ci@example.org" -e ABYSS_PUBLIC_URL="https://kit.example.org" \
            -e ABYSS_FEATURES=hosted-chapters \
            abyssreader-server-kit:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' kit)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' kit | grep -qx healthy
      - name: Sign up, then the admin commands through docker exec
        run: |
          curl -fsS http://127.0.0.1:8080/api/status
          echo
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/auth/sign-up -H 'Content-Type: application/json' \
            -d '{"displayName":"cireader","email":"reader@example.com","password":"correct-horse-7"}' -o /dev/null
          docker exec kit abyssreader-server admin users reset-password reader@example.com
          docker exec kit abyssreader-server admin users disable reader@example.com
          if docker exec kit abyssreader-server admin users disable nobody@example.com; then exit 1; fi
      - name: Import the example catalog twice, browse it, load a cover
        run: |
          docker exec kit abyssreader-server admin import /import/sample-catalog
          docker exec kit abyssreader-server admin import /import/sample-catalog | grep -q 'Titles: 0 added, 0 updated, 6 unchanged, 0 failed'
          curl -fsS 'http://127.0.0.1:8080/api/v1/titles?sort=alphabetical' -o titles.json
          jq -e '.totalItems == 6' titles.json
          cover="$(jq -r '.items[0].coverUrl' titles.json)"
          case "$cover" in https://kit.example.org/covers/*.png) ;; *) echo "cover URL: $cover"; exit 1 ;; esac
          curl -fsS "http://127.0.0.1:8080${cover#https://kit.example.org}" -o cover.png
          head -c 4 cover.png | od -c | grep -q 'P   N   G'
          curl -fsS http://127.0.0.1:8080/api/v1/definitions/manifest
          docker exec kit abyssreader-server admin titles remove unfinished-map
      - name: Import the example hosted title twice, read its long strip as slices, load a page
        run: |
          curl -fsS http://127.0.0.1:8080/api/status | jq -e '.contracts[0].features == ["hosted-chapters"]'
          docker exec kit abyssreader-server admin import /import/sample-hosted | tee first.txt
          grep -q 'Hosted chapters: 3 added, 0 updated, 0 unchanged, 0 removed, 0 failed' first.txt
          docker exec kit abyssreader-server admin import /import/sample-hosted | grep -q 'Page files: 0 stored, 4 already stored'
          curl -fsS http://127.0.0.1:8080/api/v1/sources | jq -e '[.items[] | select(.hosted)] | length == 1 and .[0].website == "https://kit.example.org"'
          st="$(curl -fsS http://127.0.0.1:8080/api/v1/titles/by-slug/the-night-ferry | jq -r '.sources[] | select(.sourceSlug == "hosted") | .id')"
          curl -fsS "http://127.0.0.1:8080/api/v1/source-titles/$st/chapters?order=asc" -o chapters.json
          jq -e '.totalItems == 3 and .items[1].pageCount == 2' chapters.json
          curl -fsS "http://127.0.0.1:8080/api/v1/chapters/$(jq -r '.items[1].id' chapters.json)/pages" -o pages.json
          jq -e '[.items[] | .width == 800 and .height == 4500] | all' pages.json
          page="$(jq -r '.items[0].imageUrl' pages.json)"
          case "$page" in https://kit.example.org/pages/*.png) ;; *) echo "page URL: $page"; exit 1 ;; esac
          curl -fsS -D headers.txt "http://127.0.0.1:8080${page#https://kit.example.org}" -o page.png
          grep -qi '^cache-control: public, max-age=31536000, immutable' headers.txt
          head -c 4 page.png | od -c | grep -q 'P   N   G'
          docker exec kit abyssreader-server admin titles remove night-ferry
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080${page#https://kit.example.org}")" = 404
      - name: The image carries the licence texts and current third-party notices
        run: |
          docker cp kit:/usr/share/doc/abyssreader-server ./image-doc
          ls -l image-doc
          for f in LICENSE LICENSE-DOCS NOTICE THIRD_PARTY_NOTICES; do test -s "image-doc/$f"; done
          grep -q '^modernc.org/sqlite ' image-doc/THIRD_PARTY_NOTICES
          grep -q 'Required Notice: Copyright 2026 Abyss Reader' image-doc/NOTICE
      - name: Server log
        if: always()
        run: docker logs kit || true

  installer:
    name: install.sh end to end (own proxy, real Docker, as root)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: shellcheck (POSIX sh) and dash syntax
        run: |
          shellcheck --version | head -n 2
          shellcheck -s sh install.sh scripts/stamp-install.sh scripts/test-install.sh scripts/test-install-digest.sh scripts/test-install-digest-docker.sh scripts/test-backup-install.sh scripts/test-custom-image-install.sh scripts/testdata/*.sh scripts/check-licence-headers.sh
          for f in install.sh scripts/stamp-install.sh scripts/test-install.sh scripts/test-install-digest.sh scripts/test-install-digest-docker.sh scripts/test-backup-install.sh scripts/test-custom-image-install.sh scripts/testdata/*.sh; do dash -n "$f"; done
      - name: Check custom image selection and confirmation
        run: python3 scripts/test-custom-image-review.py
      - name: Build the image as the release would tag it (never pushed)
        run: docker build --build-arg VERSION=0.0.0-ci -t ghcr.io/iglace/abyssreader-server-kit:0.0.0-ci .
      - name: Install and configure a locally built fork via KIT_IMAGE
        run: |
          mkdir -p dist
          sudo sh scripts/test-custom-image-install.sh ghcr.io/iglace/abyssreader-server-kit:0.0.0-ci
      - name: Check digest pinning and stamp the isolated local fixture
        run: |
          sh scripts/test-install-digest.sh
          sh scripts/test-release-read-errors.sh
          digest="sha256:$(printf '%064d' 0)"
          scripts/stamp-install.sh 1.0.0 "$digest" dist/release-install.sh
          grep -Fxq "KIT_IMAGE_DIGEST=$digest" dist/release-install.sh
          scripts/stamp-install.sh --local-tag 0.0.0-ci
          grep -qx 'KIT_VERSION=0.0.0-ci' dist/install.sh
          # An unstamped install.sh refuses to install.
          if sudo sh install.sh --answers /dev/null 2>err.txt; then exit 1; fi
          grep -q 'not from a kit release' err.txt
          # The release copy has no test hooks: ABYSS_INSTALL_TEST does not skip the root check.
          if grep -q 'ABYSS_INSTALL_' dist/release-install.sh; then exit 1; fi
          if ABYSS_INSTALL_TEST=1 ABYSS_INSTALL_DIR="$RUNNER_TEMP/x" sh dist/release-install.sh --answers /dev/null 2>err.txt; then exit 1; fi
          grep -q 'run it as root' err.txt
          test ! -e "$RUNNER_TEMP/x"
      - name: Install, check, upgrade and roll back a digest pin using real Docker
        run: sudo sh scripts/test-install-digest-docker.sh ghcr.io/iglace/abyssreader-server-kit:0.0.0-ci
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.4'
      - name: Build the healthy and deliberately broken upgrade fixtures
        run: sh scripts/testdata/build-upgrade-fixtures.sh dist
      - name: Install, configure, back up, recover, roll back, restore and uninstall
        run: sudo sh scripts/test-install.sh 0.0.0-ci

# sqlc v1.31.1: `sqlc generate` writes internal/store/sqlcdb from the migrations and queries.
# CI runs `sqlc diff` so the generated code never drifts. The advanced setup (PostgreSQL, kit 1.x)
# gets its own block here with its own migrations and queries.
version: "2"
sql:
  - engine: sqlite
    schema: internal/store/migrations
    queries: internal/store/queries
    gen:
      go:
        package: sqlcdb
        out: internal/store/sqlcdb
        emit_empty_slices: true

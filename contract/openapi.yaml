  # ───────────────────────────── Sync (core) ─────────────────────────────
  /api/v1/sync/push:
    post:
      operationId: syncPush
      tags: [Sync]
      summary: Push sync records
      description: |
        The sync contract, unchanged from today's: shapes, kinds, conflict rules, caps and merges
        are in `sync/sync.schema.json` and the worked examples beside it (`sync/rules/`,
        `sync/merge/`). In the sync records `mainMangaId` means the **title id**; the name stays
        until the next major version. An envelope that is not `{items: [1..500 objects]}` is
        `400 validation_failed`; a bad item never fails the batch, it comes back `rejected`.

        **Sync enums** (the schema itself cannot carry the markers, so they are stated here):
        - `kind` is **open** in pull changes: the app skips a change whose kind it does not know
          (today's app does). In a push it is **closed per server**: a server
          rejects an item of a kind it does not know as `rejected` / `invalid` (schema check of
          `pushItem`). New kinds come with a minor version, and the app pushes them only to a
          server whose minor version has them.
        - `status` of a push result is **open**: the app treats an unknown status as a rejection
          and drops the op.
        - `reason` of a push result is **open**: the app keeps it as text and does not branch on
          it.
        - `opinion` (kind `rating`) is **closed**: `up` or `down`.
      x-feature: core
      x-auth: required
      security:
        - session: []
        - session: []
          accessKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "sync/sync.schema.json#/$defs/pushRequest" }
      responses:
        "200":
          description: One result per item, and the cursor after the push.
          content:
            application/json:
              schema: { $ref: "sync/sync.schema.json#/$defs/pushResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/SessionInvalid" }
        "403": { $ref: "#/components/responses/AccessKey" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/ServerError" }

  /api/v1/sync/pull:
    get:
      operationId: syncPull
      tags: [Sync]
      summary: Pull sync changes after a cursor
      description: |
        The first pull omits `cursor` and gets a full snapshot. Cursors are opaque: the app stores
        and echoes them and never parses them. A bad cursor or limit is `400 validation_failed`.
        `409` (body `{fullResyncRequired: true}`, fixed by the sync schema) tells the app to start
        over without a cursor.
      x-feature: core
      x-auth: required
      security:
        - session: []
        - session: []
          accessKey: []
      parameters:
        - name: cursor
          in: query
          description: The cursor from the previous pull or push; omitted on the first pull.
          schema: { $ref: "sync/sync.schema.json#/$defs/cursor" }
        - name: limit
          in: query
          description: At most this many changes (default 500).
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        "200":
          description: A page of changes.
          content:
            application/json:
              schema: { $ref: "sync/sync.schema.json#/$defs/pullResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/SessionInvalid" }
        "403": { $ref: "#/components/responses/AccessKey" }
        "409":
          description: The cursor can no longer be served; pull again without one.
          x-error-codes: []
          content:
            application/json:
              schema: { $ref: "sync/sync.schema.json#/$defs/pullConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/ServerError" }

  # ───────────────────────────── Sources and definitions (core) ─────────────────────────────
  /api/v1/sources:
    get:
      operationId: listSources

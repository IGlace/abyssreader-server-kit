# This kit's contract/ is the source of truth for the AbyssReader server contract.
# Tags contract-vX.Y version routes and fields. A docs label such as contract-v1.0-docs1
# identifies a notice or README update to the same contract version.
# The official server’s tests and the app’s tests use a copy pinned to a kit tag.
# Examples: ./examples/<operationId>.json. Sync schema: ./sync/sync.schema.json.
# The kit checks server responses against this document in .github/workflows/ci.yml.
openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: AbyssReader server contract
  version: "1.0"
  summary: Every endpoint an AbyssReader server must or may offer, contract version 1.0.
  license:
    name: PolyForm Noncommercial 1.0.0
    identifier: PolyForm-Noncommercial-1.0.0
  description: |
    The **server contract** describes every endpoint a server must offer (core features) or may
    offer (optional features). Servers are built against it, and the app's conformance check
    tests servers against it. Vocabulary: the AbyssReader glossary (server, server operator,
    title, source title, source, hosted source, definition, signing key, vote, rating, report,
    backup, core feature, optional feature, contract version, breaking change, access key).

    ## Address, base path and requests

    - A server's address is an HTTPS origin, `https://host[:port]`, with no path. Plain `http://`
      is never accepted.
    - `GET /api/status` is the one path that never changes. It announces, per contract major
      version, a `basePath`; every v1 route lives under it. For contract major 1 the base path is
      `/api/v1`, and this file writes the v1 routes with that prefix.
    - Request bodies are UTF-8 JSON (`Content-Type: application/json`). The one exception is the
      backup upload: `multipart/form-data` with the file in a field named `file`.
    - The app sends `User-Agent: AbyssReader/<version> (<android|ios>)` on every request to a
      server. A server may log it but **must not change its behaviour on it**: compatibility is
      expressed only through contract versions. The contract has no minimum app version.
    - The app sends `Accept-Language`; a server may use it for `message` texts.
    - **Unknown fields:** the app ignores response fields it does not know; a server ignores
      request fields it does not know.
    - **Server extras:** a server may add its own routes, but never extra fields in v1 bodies.
      A route of a server's own may sit under the base path when it belongs there (the kit's Google
      sign-in callback is `/api/v1/auth/google/callback`); it is not part of the contract, the app
      never calls it, and a later contract version may claim any path not already used by the
      server. Prefer paths outside the base path for anything else. Extras of the official server
      live outside this file.

    ## Contract versions

    The contract version is `MAJOR.MINOR` (no patch number).

    - **Breaking change (new major):** removing or renaming an endpoint, a field or a value;
      changing a type; making a response field nullable or optional when it was not; making a
      request field required or adding a required one; changing what a status code means; moving a
      feature between core and optional.
    - **Addition (new minor):** a new endpoint, an optional request field, a response field, a new
      optional feature, a value in an enum marked open.
    - A later major version lives under its own base path (`/api/v2/…`), announced as another
      `contracts` entry in `/api/status`.

    ## Access key

    A server operator may require an access key (`accessKeyRequired: true` in `/api/status`).
    Then every route except `/api/status` and the Google sign-in start (opened in a browser tab)
    needs the header `X-Access-Key: <key>`. A missing key gets `403 access_key_required`, a wrong
    one `403 access_key_invalid`; neither ever means "signed out". The app sends the header only
    when the user typed a key, only to that server, and never empty. A server that does not
    require a key ignores the header. Image URLs are never protected by the key.

    ## Session

    - `Authorization: Bearer <token>`. The token is opaque: the app never decodes it and takes the
      user id from the sign-in response and `GET /api/v1/me`. Each server chooses the token's
      lifetime. There is no refresh token.
    - **401 `session_invalid`** means only "the session token is not accepted": it is missing (on a
      route that needs a session), expired, revoked, or its account was disabled, suspended or
      deleted. A token that is not valid gets 401 on **every** v1 route, public ones included; the
      server never quietly serves it anonymously. 401 is the only status that signs the app out.
    - **403** means "not allowed to do this" and never signs out.
    - A wrong password is never 401 or 403: sign-in, password change and account deletion answer
      `400 wrong_password`.
    - A password change revokes the user's other sessions and returns a new token.
    - Request bodies never carry the caller's id; the server takes it from the token.

    ## Errors

    Every non-2xx response carries the `Error` body `{code, message, fields?}` (the one exception
    is the sync pull's `409`, whose body the sync schema fixes). `code` is a snake_case word from
    an **open** enum: the app handles an unknown code by its HTTP status. `message` is human text
    the app shows only when it has no translation of its own for `code`. `fields` lists
    validation errors as `[{field, code}]`.

    Each response in this file lists the **contract's own** codes for it in `x-error-codes`. A
    server answers those situations with those codes. It may also send other snake_case codes of
    its own with the same status and the same meaning of that status (a server-specific "not
    allowed" is still a `403` that never signs out); the app handles them by their status. A
    contract code is never used with another status than the one listed here.

    | Status | The contract's codes |
    |---|---|
    | 400 | `validation_failed`, `wrong_password`, `password_not_set`, `email_unverified`, `google_code_invalid`, `backup_invalid` |
    | 401 | `session_invalid` |
    | 403 | `access_key_required`, `access_key_invalid`, `account_disabled`, `account_suspended`, `forbidden`, `sign_up_closed` |
    | 404 | `not_found`, `feature_disabled` |
    | 409 | `already_exists`, `email_taken` |
    | 413 | `too_large` |
    | 429 | `rate_limited` (with `Retry-After` in seconds) |
    | 500 | `server_error` |
    | 503 | `unavailable` |

    Any route may answer `429`, `500` or `503`. On `429` the app shows the server's `message`
    only when it has no translation for `code`, and retries that server only after `Retry-After`
    has passed. Each server sets its own rate limits.

    ## Methods and success

    GET reads, POST creates or acts, PUT replaces (for example a vote), DELETE removes; there is no
    PATCH. Creating answers `201` with the resource, an update answers `200` with the resource, and
    an action with nothing to return (delete, report, import) answers `204`. "Already done" is a
    `409`. There are no bare `true`/`false` bodies and no text bodies. The app treats any 2xx as
    success.

    ## Lists

    - Every list that can grow is paginated: query `page` (1-based, default 1) and `size` (each
      route states its default and maximum, never above 100; asking for more is a `400`). The
      response is `{items, page, size, totalItems, hasMore}`, all required; the app trusts
      `hasMore` and never works it out from the page length.
    - Small fixed lists come back whole as `{items}`: genres, sources, definition keys, the
      definitions manifest, a chapter's pages.
    - Sorting: `sort` names the field, `order` is `asc` or `desc`. Each route publishes its own
      closed list of `sort` values and their defaults.
    - A filter list repeats the parameter (`?status=ongoing&status=completed&genre=3`), never
      comma-separated. Filters take ids (sources take their slug), booleans are `true`/`false`,
      free-text search is `q`. An unknown filter value is a `400 validation_failed`, never an
      empty page.
    - Sync keeps its own cursor (`GET /api/v1/sync/pull`).

    ## Ids, timestamps, nullability

    - Every id is an integer from 1 to 2³¹−1, local to its server and never reused for another
      thing of the same kind on that server. Titles, collections and sources also have a slug; the
      id is the key everywhere else.
    - Timestamps are ISO-8601 UTC with exactly three decimals and `Z`
      (`2026-11-16T10:00:00.000Z`). A date without a time is `YYYY-MM-DD`.
    - Every response field is listed in `required` and is always sent; a field that may have no
      value is nullable and sent as `null`. (The one exception, `Error.fields`, is marked
      `x-may-be-absent`.) The app treats a missing nullable field as `null`. A non-null field that
      is missing or `null` fails the conformance check for that feature.
    - Lists are never `null` (empty is `[]`), and an empty string never stands for "no value".

    ## Enums

    Every enum is marked `x-enum: open` or `x-enum: closed`. A closed enum lists every value with
    `enum`. An open enum lists today's values in `x-values` and may gain values in a minor version:
    in a response the app tolerates a value it does not know; in a request the app sends only
    values of the server's announced minor version, and a server answers a value it does not know
    with `400 validation_failed` (except where a route says it accepts any value).

    ## Images

    Every image field (covers, avatars, source icons, comment images, chapter pages) is an absolute
    `https://` URL that the server builds or accepts. Images load with **no headers** (no bearer,
    no access key). A changed image gets a new URL, so the app may cache a URL forever.

    ## Features

    `x-feature` on each operation names its feature: `core`, or the optional feature's name as it
    appears in `/api/status` `features`. An optional feature that is switched off answers
    `404 feature_disabled` on every one of its routes, and the app hides its screens.

    | Feature | Class | Routes |
    |---|---|---|
    | Server status | core | `GET /api/status` |
    | Sign-up, sign-in and account | core | `/auth/sign-up`, `/auth/sign-in`, `/me`, `/me/password`, `/me/deletion` |
    | Catalog, search and title details | core | `/titles…`, `/genres` |
    | Covers | core | image URLs in titles (no route) |
    | Library | core | `GET /me/library` |
    | Sync | core | `/sync/push`, `/sync/pull` |
    | Sources and definitions | core | `/sources`, `/definitions/…` |
    | `comments` | optional | title comments and replies (post, edit, delete), their votes and reports |
    | `collections` | optional | collections, their titles, votes, reports, import, comments |
    | `stats` | optional | your stats and rankings |
    | `reports` | optional | title reports |
    | `backup` | optional | backup export and restore |
    | `google-sign-in` | optional | Google sign-in through the browser |
    | `hosted-chapters` | optional | chapters and pages of the hosted source |

    **What a catalog must hold.** A server's catalog has at least one title with a cover and a
    source title (otherwise the app refuses it as "empty catalog"), and at least one **readable**
    title: one with a hosted source title, or with a source title whose source has a definition in
    the manifest that verifies against the server's keys (otherwise "nothing to read"). A server
    with no definitions is valid when it hosts chapters.

    ## Limits each server sets

    A server may limit lengths, list sizes, allowed image hosts, how many titles a collection
    needs, upload sizes and request rates. A request that breaks a limit gets
    `400 validation_failed` with `fields` (or `413 too_large` for an upload). The contract says
    only "a server may limit X" unless a route sets a floor every server must accept.

    ## Outside the contract

    Publishing, promoting and canarying definitions; how a server fills its catalog; the Google
    sign-in callback path on the server; moderation tools; the official server's own extras.
servers:
  - url: https://{host}
    description: A server's HTTPS origin.
    variables:
      host:
        default: server.example.org
        description: The server's host, optionally with `:port`. No path.
tags:
  - name: Server status
    description: "Core. `GET /api/status`, the one fixed path."
  - name: Account
    description: "Core. Sign-up, sign-in, profile, password change and account deletion."
  - name: Catalog
    description: "Core. Search, title details, genres. Covers are image URLs inside titles."
  - name: Library
    description: "Core. The caller's library lists, written through sync."
  - name: Sync
    description: "Core. The sync contract (`sync/sync.schema.json`), unchanged in v1."
  - name: Sources and definitions
    description: "Core. Sources, definition signing keys, manifest, definitions, health reports."
  - name: Comments
    description: "Optional feature `comments`."
  - name: Collections
    description: "Optional feature `collections`."
  - name: Stats
    description: "Optional feature `stats` (stats and rankings)."
  - name: Reports
    description: "Optional feature `reports` (title reports only)."
  - name: Backup
    description: "Optional feature `backup`."
  - name: Google sign-in
    description: "Optional feature `google-sign-in`."
  - name: Hosted chapters
    description: "Optional feature `hosted-chapters`."

paths:
  # ───────────────────────────── Server status (fixed path) ─────────────────────────────
  /api/status:
    get:
      operationId: getStatus
      tags: [Server status]
      summary: What the server is and which contract versions and features it offers
      description: |
        Always public, at this fixed path on every server, whatever its contract versions. The
        app reads it before adding a server and on every refresh, and compares the versions each
        time. The server ignores `Authorization` and `X-Access-Key` here.

        **Compatibility:** the app lists the major versions it supports and the lowest minor it
        needs in each, and uses the highest major both sides offer. A server minor that is too low
        means "server needs an update"; a server that offers only newer majors means "update the
        app"; a newer minor on the server is fine.
      x-feature: core
      x-auth: none
      security: []
      responses:
        "200":
          description: The server's status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerStatus" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/ServerError" }

  # ───────────────────────────── Account (core) ─────────────────────────────
  /api/v1/auth/sign-up:
    post:
      operationId: signUp
      tags: [Account]
      summary: Create an account and get a session
      description: |
        Creates an account and answers with a **working session at once**. There is no email
        verification step; an operator who wants gatekeeping closes sign-up (`signUpOpen: false`)
        or requires an access key.

        A server accepts **any syntactically valid email address** and never checks that it can
        receive mail. The route always exists; when sign-up is closed it answers
        `403 sign_up_closed`.

        **Minimum every server accepts** (owner decision 2026-11-19): a display name of 3–32 ASCII
        letters and digits, and a password of 8–64 printable ASCII characters. A server may not
        refuse values inside this minimum. It may accept wider limits, and it answers values
        outside its own limits with `400 validation_failed`. The minimum lets the conformance
        check's random check account sign up on every server.
      x-feature: core
      x-auth: none
      security:
        - {}
        - accessKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignUpRequest" }
      responses:
        "201":
          description: The account was created; the session works immediately.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/SessionInvalid" }
        "403":
          description: Access key problem, or sign-up is closed.
          x-error-codes: [access_key_required, access_key_invalid, sign_up_closed]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: An account with this email already exists.
          x-error-codes: [email_taken]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/ServerError" }

  /api/v1/auth/sign-in:
    post:
      operationId: signIn
      tags: [Account]
      summary: Sign in with email and password
      description: |
        An unknown email and a wrong password both answer `400 wrong_password`.

        - `403 account_suspended`: the server operator suspended the account for breaking the
          server's rules (moderation, for example after reports). The operator may lift it.
        - `403 account_disabled`: the account is switched off for any other reason: it was
          deactivated, is waiting for deletion, or cannot sign in for an administrative reason.

        The app uses its own translated text for both codes. The `message` field follows the
        general fallback rule. Either way the account's existing sessions get `401 session_invalid`.
        An account without a password (made with Google sign-in) gets `400 wrong_password`.
      x-feature: core
      x-auth: none
      security:
        - {}
        - accessKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignInRequest" }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400":
          description: Validation failed, or the email or password is wrong.
          x-error-codes: [validation_failed, wrong_password]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/SessionInvalid" }
        "403":
          description: Access key problem, or the account may not sign in.
          x-error-codes: [access_key_required, access_key_invalid, account_disabled, account_suspended]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/ServerError" }

  /api/v1/me:
    get:
      operationId: getMe
      tags: [Account]
      summary: The signed-in account
      x-feature: core
      x-auth: required
      security:
        - session: []
        - session: []
          accessKey: []
      responses:
        "200":
          description: The caller's account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/SessionInvalid" }
        "403": { $ref: "#/components/responses/AccessKey" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/ServerError" }
    put:
      operationId: updateMe
      tags: [Account]
      summary: Replace the caller's profile
      description: |
        Replaces the display name and avatar. The email cannot be changed in v1, and the password
        changes through `PUT /api/v1/me/password`. A server may limit avatar hosts and the display
        name with `400 validation_failed`.
      x-feature: core
      x-auth: required
      security:
        - session: []
        - session: []
          accessKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/SessionInvalid" }
        "403": { $ref: "#/components/responses/AccessKey" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/ServerError" }

  /api/v1/me/deletion:
    post:
      operationId: deleteAccount
      tags: [Account]
      summary: Delete the caller's account and everything it created
      description: |
        **Deleting an account deletes everything it created:** its library, sync records, votes,
        comments and replies, collections (with their comments), reports and anything it
        restored from a backup. Replies other accounts wrote under its comments may stay, without
        the link to it. After a `204` the old token gets `401` everywhere and signing in fails.
        View counters may keep their increments.

        An account with a password confirms with it (`400 wrong_password` when it is `null` or
        wrong). An account without one (`hasPassword: false`, made with Google sign-in) is
        deleted with the session alone: it sends `{"password": null}`, after a confirmation in the
        app. (A password change on such an account is `400 password_not_set`; deletion never is.)
        A POST, not a DELETE with a body, because some proxies and clients drop DELETE bodies.
      x-feature: core
      x-auth: required
      security:
        - session: []
        - session: []
          accessKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteAccountRequest" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400":
          description: Validation failed, or the password is missing or wrong.
          x-error-codes: [validation_failed, wrong_password]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/SessionInvalid" }
        "403": { $ref: "#/components/responses/AccessKey" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/ServerError" }

  /api/v1/me/password:
    put:
      operationId: changePassword
      tags: [Account]
      summary: Change the caller's password
      description: |
        Revokes every other session of the account and answers with a new token, which replaces
        the caller's. A wrong current password is `400 wrong_password`; an account without a
        password (`hasPassword: false`) gets `400 password_not_set` (v1 has no "set a password").
        The new password follows the same floor as sign-up.
      x-feature: core
      x-auth: required
      security:
        - session: []
        - session: []
          accessKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "200":
          description: The password changed; the new session replaces the old one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400":
          description: Validation failed, the current password is wrong, or the account has none.
          x-error-codes: [validation_failed, wrong_password, password_not_set]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/SessionInvalid" }
        "403": { $ref: "#/components/responses/AccessKey" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/ServerError" }

  # ───────────────────────────── Catalog (core) ─────────────────────────────
  /api/v1/titles:
    get:
      operationId: searchTitles
      tags: [Catalog]
      summary: Search and browse the catalog
      description: |
        Filters combine with AND; the values of one repeated filter combine with OR, except
        `genre` (the title has **every** listed genre) and `excludeGenre` (the title has **none**
        of them). `q` matches the title's `name` and `altNames`. A title with `rating: null`
        matches only when the rating range is the whole 0–10 (no `minRating`/`maxRating`, or 0
        and 10). When the caller is signed in, titles on the caller's blacklist are left out.
        An unknown genre id, source slug or status value is `400 validation_failed`.

        Sort values: `latest` (by `updatedAt`, the default), `popular` (by `rating`, nulls last),
        `trending` (by `views`), `alphabetical` (by `name`). `order` defaults to `desc`, or to
        `asc` with `sort=alphabetical`.
      x-feature: core
      x-auth: optional
      security:
        - {}
        - session: []
        - accessKey: []
        - session: []
          accessKey: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Q"
        - name: genre
          in: query
          description: Genre ids the title must all have.
          style: form
          explode: true
          schema: { type: array, items: { $ref: "#/components/schemas/Id" } }
        - name: excludeGenre
          in: query
          description: Genre ids the title must not have.
          style: form
          explode: true
          schema: { type: array, items: { $ref: "#/components/schemas/Id" } }
        - name: status
          in: query
          description: Publication statuses (OR).
          style: form
          explode: true
          schema: { type: array, items: { $ref: "#/components/schemas/TitleStatus" } }
        - name: lang
          in: query
          description: Language codes (OR); the title has a source title in one of them.
          style: form
          explode: true
          schema: { type: array, items: { $ref: "#/components/schemas/LangCode" } }
        - name: source
          in: query
          description: Source slugs (OR); the title has a source title on one of them.
          style: form
          explode: true
          schema: { type: array, items: { $ref: "#/components/schemas/SourceSlug" } }
        - name: minRating
          in: query
          schema: { type: number, minimum: 0, maximum: 10 }
        - name: maxRating
          in: query
          schema: { type: number, minimum: 0, maximum: 10 }
        - name: sort
          in: query
          schema: { $ref: "#/components/schemas/TitleSort" }
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: One page of titles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TitlesPage" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/SessionInvalid" }
        "403": { $ref: "#/components/responses/AccessKey" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/ServerError" }

  /api/v1/titles/{id}:
    get:
      operationId: getTitle
      tags: [Catalog]
      summary: One title by id
      description: |

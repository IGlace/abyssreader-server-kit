        default: { $ref: "#/components/responses/ServerError" }

  /api/v1/definitions/keys:
    get:
      operationId: listDefinitionKeys
      tags: [Sources and definitions]
      summary: The server's definition signing keys (whole list)
      description: |
        Ed25519 only. Key ids are unique on the server and mean something only within this
        server. The list may be empty (a server with no definitions). The app pins the keys when
        the server is added and its check passes.

        **Planned rotation:** a key the app has not pinned yet is accepted only with an
        `endorsement`: an Ed25519 signature by an already pinned key (`byKeyId`) over the UTF-8
        statement `abyssreader-key-endorsement-v1\n<oldKeyId>\n<newKeyId>\n<newPublicKey>`
        (`<oldKeyId>` = `byKeyId`, `<newPublicKey>` = the base64 text of `publicKey`). A key
        that leaves the list is unpinned. A community server must never list a key equal to one
        of the app's built-in owner keys.
      x-feature: core
      x-auth: optional
      security:
        - {}
        - session: []
        - accessKey: []
        - session: []
          accessKey: []
      responses:
        "200":
          description: The keys.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefinitionKeyList" }
        "401": { $ref: "#/components/responses/SessionInvalid" }
        "403": { $ref: "#/components/responses/AccessKey" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/ServerError" }

  /api/v1/definitions/manifest:
    get:
      operationId: getDefinitionManifest
      tags: [Sources and definitions]
      summary: One entry per source that has a definition (whole list)
      description: |
        Not paginated. `ETag` is required, and `If-None-Match` with the current ETag answers `304`.
        A server with no definitions answers an empty list. A source title has
        `hasDefinition: true` only when this manifest has its source's slug.

        Signatures: each entry's `signature` is an Ed25519 signature, by the key `keyId` from
        `GET /api/v1/definitions/keys`, over the UTF-8 statement
        `abyssreader-definition-v2\n<sourceSlug>\n<definitionVersion>\n<contentHash>`; a revoked
        entry (`revoked: true`, `contentHash: null`) signs
        `abyssreader-revocation-v2\n<sourceSlug>\n<definitionVersion>` instead. The app trusts a
        community server's definitions only through that server's own keys.

        **Versions and revocations.** `definitionVersion` only grows per slug: the app keeps the
        highest version it has accepted as the slug's floor and refuses any entry at or below it
        (`version_rollback`). A revoked entry at version N revokes **every version of the slug
        below N**: the app disables the slug's stored definition and raises the floor to N, so
        neither it nor an older one can come back; a later definition must have a version above
        N. A slug whose entry is revoked has `hasDefinition: false` on its source titles and
        answers `404 not_found` on `GET /api/v1/definitions/{slug}`. A slug that leaves the
        manifest is disabled the same way.
      x-feature: core
      x-auth: optional
      security:
        - {}
        - session: []
        - accessKey: []
        - session: []
          accessKey: []
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The manifest.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefinitionManifest" }
        "304":
          description: Unchanged since the ETag sent in `If-None-Match`. No body.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
        "401": { $ref: "#/components/responses/SessionInvalid" }
        "403": { $ref: "#/components/responses/AccessKey" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/ServerError" }

  /api/v1/definitions/{slug}:
    get:
      operationId: getDefinition
      tags: [Sources and definitions]
      summary: A source's current definition
      description: |
        `ETag` is required, and `If-None-Match` with the current ETag answers `304`. `content` is
        the definition's JSON text, valid against the contract's `definition.schema.json`.
        `contentHash` is the lowercase hex SHA-256 of its UTF-8
        bytes; `signature` follows the manifest's statement. A slug with no current definition
        (unknown or revoked) is `404 not_found`.

        **Definition sandbox.** A definition may contact only its `baseUrl`'s host and the host
        names in its signed `hosts` list (image CDNs and the like): HTTPS public host names only,
        never localhost, private, link-local, `.local` or IPv6 ULA addresses. The app enforces this
        on every redirect hop, whoever signed the definition. A definition is at most 2 MB.
      x-feature: core
      x-auth: optional
      security:
        - {}
        - session: []
        - accessKey: []
        - session: []
          accessKey: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { $ref: "#/components/schemas/SourceSlug" }
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The definition.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefinitionContent" }
        "304":
          description: Unchanged since the ETag sent in `If-None-Match`. No body.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/SessionInvalid" }
        "403": { $ref: "#/components/responses/AccessKey" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/ServerError" }

  /api/v1/definitions/{slug}/health:
    post:
      operationId: reportDefinitionHealth
      tags: [Sources and definitions]
      summary: Report anonymous error counts for a definition
      description: |
        The app batches its definition errors per slug. The counts carry no account, device or
        address information: the app sends **no `Authorization`** here (only `X-Access-Key` when
        the server requires one), and a server must not ask for a session. `errorKind` is an open

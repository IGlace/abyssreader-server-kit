name: Install problem
description: Get help installing or upgrading an official server kit image.
title: "Install: "
body:
  - type: input
    id: release
    attributes:
      label: Kit release
      description: Which official release are you installing?
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Setup
      description: Include the server OS and Docker Compose version, and whether you chose Caddy or your own proxy.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and result
      description: Describe the command and what happened. Remove credentials and personal data from the output.
    validations:
      required: true

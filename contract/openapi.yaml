        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/SessionInvalid" }
        "403": { $ref: "#/components/responses/AccessKey" }
        "404": { $ref: "#/components/responses/NotFoundOrDisabled" }
        "409": { $ref: "#/components/responses/AlreadyReported" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/ServerError" }

  # ───────────────────────────── Backup (optional: backup) ─────────────────────────────
  /api/v1/me/backup:
    get:
      operationId: exportBackup
      tags: [Backup]
      summary: Download a backup of the caller's own account
      description: |
        A gzip'd Mihon/Tachiyomi `.tachibk` (Mihon's `Backup` protobuf), built from the caller's
        sync data, streamed synchronously. It covers the caller's own account only.

        - One `BackupManga` per source title the caller has chapter marks or a position on. A title
          with neither gets one entry for its first readable source title (one whose source has a
          definition, or the hosted one).
        - Chapter marks become `BackupChapter{url, read, bookmark, lastPageRead, name,
          chapterNumber, lastModifiedAt}`; the position becomes `BackupHistory{url, lastRead}`,
          plus a chapter carrying `lastPageRead` when it has no mark. The synthesized chapter sets
          `positionOnlyChapter` in the extra message.
        - Every exported chapter has a non-empty `name` (field 2). When the sync name is missing
          or blank, export uses `Chapter <number>` for a finite nonnegative chapter number, then
          a descriptive last URL path segment after percent decoding, then `Chapter`. Segments
          with file extensions and generic query-based viewer paths use `Chapter`. The number
          uses plain decimal notation with no trailing fractional zeros.
        - `favorite` is always written explicitly (Mihon's default is `true`).
        - Every `BackupManga` carries the **AbyssReader extra message** at field number **9100**,
          which other readers skip:

          ```proto
          message AbyssReaderExtra {
            string sourceWebsite = 1;  // the source's website (https origin), as in GET /sources
            repeated string lists = 2; // each of "favorite", "planning", "blacklist" at most once
            optional string vote = 3;  // "up" or "down"; absent = no vote
            optional bool positionOnlyChapter = 4; // true only when a chapter was synthesized for history
            repeated uint32 derivedChapterNameIndexes = 5 [packed = false];
          }
          // In BackupManga: AbyssReaderExtra abyssReader = 9100;
          ```

          `sourceWebsite` is always written. `lists` names every library list the title is on,
          in any order (the lists are independent sync kinds, so a title can be on several); no
          element means it is on none. `vote` is absent when the caller has no vote on the title.
          `derivedChapterNameIndexes` lists one-based indexes into that entry's `BackupChapter`
          messages (field 16) in wire order. The export writes one field-5 tag with wire type 0
          for each generated name and omits field 5 when every name is stored. No field ever
          holds an empty string. A restore ignores values it does not know.
        - Not exported: the updates inbox, downloads, Mihon categories, tracking and preferences.
        - The file is not encrypted.
      x-feature: backup
      x-auth: required
      security:
        - session: []
        - session: []
          accessKey: []
      responses:
        "200":
          description: The backup file.
          headers:
            Content-Disposition:
              description: '`attachment; filename="abyssreader_<server>_<yyyy-MM-dd_HH-mm>.tachibk"`'
              required: true
              schema:
                type: string
                pattern: '^attachment; filename="abyssreader_[^"/\\]+_[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2}\.tachibk"$'
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        "401": { $ref: "#/components/responses/SessionInvalid" }
        "403": { $ref: "#/components/responses/AccessKey" }
        "404": { $ref: "#/components/responses/FeatureDisabled" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/ServerError" }

  /api/v1/me/backup/restore:
    post:
      operationId: restoreBackup
      tags: [Backup]
      summary: Restore a backup file into the caller's account
      description: |
        Synchronous. The server processes the file in memory and never stores or logs it.

        **Input.** gzip or raw protobuf, whatever the file name: Mihon/Tachiyomi `.tachibk`, the
        old AbyssReader app's `.proto.gz`, and files from `GET /api/v1/me/backup`. JSON or
        undecodable input is `400 backup_invalid`; a file with no entries is a valid `200` with
        zeros. Each server sets its own size limit (`413 too_large`), which must be **at least
        10 MB**.

        **Matching**, first hit wins:
        1. the extra message's `sourceWebsite` + the backup entry's URL (a source matches when its
           `website` has the same host, `www.` ignored);
        2. otherwise the server's own map of Mihon/Tachiyomi numeric source ids (outside the
           contract) + the URL;
        3. otherwise the backup `title`, normalized, equals exactly one title's `name` or one of
           its `altNames`: this restores only the library list, skips chapter marks and position,
           and counts as `matchedByName`.

        URLs compare as path + query (an absolute URL is reduced to that), ignoring a trailing
        slash. Chapters match by source + chapter URL. A restore never creates titles or source
        titles; anything not in the catalog is unmatched.

        **Position-only chapters.** When `positionOnlyChapter` is true, the newest history row
        has a positive `lastRead`, and exactly one chapter in that entry has the same wire URL as
        that row, the chapter supplies the reading position and its page. It creates no chapter
        mark if both `read` and `bookmark` are false. Genuine page-only marks are restored when
        the flag is absent or false, or when the URL match is missing or ambiguous. Chapters
        with `read` or `bookmark` set are always handled as marks.

        **Derived chapter names.** Restore counts every chapter in wire order, including chapters
        it later discards. It ignores zero and indexes beyond the chapter list and applies
        repeated indexes once. A marked chapter's name is treated as absent before restoring
        a mark or position, so a name missing from sync stays null and a saved name for the same
        source and chapter is preserved. Unmarked names follow the existing merge rules. An
        unmarked name matching a recognized legacy fallback can fill a missing name while
        preserving an existing non-blank name for the same source and chapter.

        **Merge** (adds, never removes; newer wins). Everything is written as ordinary sync
        records, stamped with the file's own times (`favoriteModifiedAt`, `lastModifiedAt`,
        history `lastRead`, or the restore time when the file has none), so an older file never
        revives something removed later. `favorite=false`, `read=false` or a missing entry never
        removes anything. `read` and `bookmark` are OR'd; `lastPageRead`, the position and the
        vote follow the newer time. A Mihon or old-app entry with `favorite=true` and no extra
        message goes on the favorite list. Categories, tracking, preferences, extension stores,
        notes and excluded scanlators are ignored. Restoring the same file again changes nothing.
      x-feature: backup
      x-auth: required
      security:
        - session: []
        - session: []
          accessKey: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/BackupUpload" }
      responses:
        "200":
          description: What the restore matched and wrote.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRestoreReport" }
        "400":
          description: Validation failed (no `file` part), or the file is not a backup.
          x-error-codes: [validation_failed, backup_invalid]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/SessionInvalid" }
        "403": { $ref: "#/components/responses/AccessKey" }
        "404": { $ref: "#/components/responses/FeatureDisabled" }
        "413":
          description: Above this server's upload limit (every server accepts at least 10 MB).
          x-error-codes: [too_large]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/ServerError" }

  # ───────────────────────────── Google sign-in (optional: google-sign-in) ─────────────────────────────
  /api/v1/auth/google/start:
    get:
      operationId: startGoogleSignIn
      tags: [Google sign-in]
      summary: Start Google sign-in in the browser
      description: |
        The app opens this URL in a browser tab (Custom Tabs / `ASWebAuthenticationSession`),
        never in an embedded webview, so it carries no headers: no bearer and no access key.
        The server redirects to Google with its own Web client. After Google, the server's own
        callback (its path is the server's business) redirects to the one fixed app address:

        - `com.premium.abyss.abyssreader://google-sign-in?state=<state>&code=<code>` on success;
        - `com.premium.abyss.abyssreader://google-sign-in?state=<state>&error=cancelled` or
          `…&error=google_failed` otherwise.

        That is the only redirect target a server may use. The return carries only what happened
        at Google; every account decision happens at `POST /api/v1/auth/google/token`. The app
        ignores a return whose `state` is not its pending sign-in. Bad or missing parameters get
        `400 validation_failed` as JSON, with no redirect.
      x-feature: google-sign-in
      x-auth: none
      security: []
      parameters:
        - name: state
          in: query
          required: true
          description: The app's random value, echoed on the return.
          schema: { type: string, minLength: 16, maxLength: 256, pattern: '^[A-Za-z0-9._~-]+$' }
        - name: codeChallenge
          in: query
          required: true
          description: PKCE code challenge, base64url SHA-256 of the verifier, no padding.
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        - name: codeChallengeMethod
          in: query
          required: true
          schema: { type: string, enum: [S256], x-enum: closed }
      responses:
        "302":
          description: |
            Redirect to `https://accounts.google.com/o/oauth2/v2/auth` with `response_type=code`,
            the server's `client_id`, an https `redirect_uri` on the server, and a `scope`
            containing `openid` and `email`.
          headers:
            Location:
              required: true
              schema:
                type: string
                pattern: '^https://accounts\.google\.com/o/oauth2/v2/auth\?'
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/FeatureDisabled" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/ServerError" }

  /api/v1/auth/google/token:
    post:
      operationId: exchangeGoogleCode
      tags: [Google sign-in]
      summary: Exchange the one-time code for a session
      description: |
        The code works once, lives 60 seconds and needs the PKCE verifier. The access key and
        every account decision are checked here, so a wrong key creates nothing.

        - Accounts are found by Google's `sub` only. When no account has the `sub` but a password
          account has the email: `409 email_taken` ("sign in with your password"). There is no
          linking in v1.
        - A new account is made only when Google says the email is verified
          (`400 email_unverified` otherwise) and never when sign-up is closed
          (`403 sign_up_closed`); an existing `sub` still signs in then. Its display name comes
          from the Google profile, made unique by the server. It has no password
          (`hasPassword: false`).
      x-feature: google-sign-in
      x-auth: none
      security:
        - {}
        - accessKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoogleTokenRequest" }
      responses:
        "200":
          description: An existing account signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "201":
          description: A new account was made and signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400":
          description: Validation failed, the code is unknown, used, expired or does not match the verifier, or Google did not verify the email.
          x-error-codes: [validation_failed, google_code_invalid, email_unverified]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/SessionInvalid" }
        "403":
          description: Access key problem, sign-up closed, or the account may not sign in.
          x-error-codes: [access_key_required, access_key_invalid, sign_up_closed, account_disabled, account_suspended]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/FeatureDisabled" }
        "409":
          description: A password account already has this email.
          x-error-codes: [email_taken]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/ServerError" }

  # ───────────────────────────── Hosted chapters (optional: hosted-chapters) ─────────────────────────────
  /api/v1/source-titles/{id}/chapters:
    get:
      operationId: listChapters
      tags: [Hosted chapters]
      summary: The chapters of a hosted source title
      description: |
        Only hosted source titles have chapters here; any other source title id is
        `404 not_found`. Sort value: `number` (the default); `order` defaults to `desc`.
        A server with `hosted-chapters` on has at least one hosted source title with a chapter
        that has pages.
      x-feature: hosted-chapters
      x-auth: optional
      security:
        - {}
        - session: []
        - accessKey: []
        - session: []
          accessKey: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/Page"
        - name: size
          in: query
          description: Page size (default 100, at most 100).
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - name: sort
          in: query
          schema: { $ref: "#/components/schemas/ChapterSort" }
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: One page of chapters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChaptersPage" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/SessionInvalid" }
        "403": { $ref: "#/components/responses/AccessKey" }
        "404": { $ref: "#/components/responses/NotFoundOrDisabled" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/ServerError" }

  /api/v1/chapters/{id}/pages:
    get:
      operationId: listChapterPages
      tags: [Hosted chapters]
      summary: A hosted chapter's pages (whole list)
      description: |
        Not paginated. Page images are JPEG, PNG or static WebP (no AVIF), at most 2000 px wide,
        6000 px tall and 5 MB each; taller strips are served as slices within those limits.
        `width` and `height` are the image's real pixel size. Image URLs follow the contract's
        image rules: absolute https, loaded with no headers, never changing (a replaced page gets
        a new URL). The access key does not protect them.
      x-feature: hosted-chapters
      x-auth: optional
      security:
        - {}
        - session: []
        - accessKey: []
        - session: []
          accessKey: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: The pages, in reading order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageImageList" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/SessionInvalid" }
        "403": { $ref: "#/components/responses/AccessKey" }
        "404": { $ref: "#/components/responses/NotFoundOrDisabled" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/ServerError" }

components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: The opaque session token from sign-up, sign-in, a password change or Google sign-in.
    accessKey:
      type: apiKey
      in: header
      name: X-Access-Key
      description: Required on every route except `/api/status` and the Google sign-in start when the server announces `accessKeyRequired`.

  parameters:
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      description: Page size (default 20, at most 100; more is `400 validation_failed`).
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Q:
      name: q
      in: query
      description: Free-text search.
      schema: { type: string, minLength: 1, maxLength: 200 }
    Order:
      name: order
      in: query
      description: Sort direction; the default is stated per route.
      schema: { type: string, enum: [asc, desc], x-enum: closed }
    IdPath:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    SlugPath:
      name: slug
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Slug" }
    CountView:
      name: countView
      in: query
      description: "`false` asks the server not to count this read as a view."
      schema: { type: boolean, default: true }
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: The ETag from the last 200; the server answers 304 when it is still current.
      schema: { type: string }

  headers:
    ETag:
      description: Entity tag of the current content (required).
      required: true
      schema: { type: string, minLength: 1 }
    RetryAfter:
      description: Seconds to wait before the next request to this server.
      required: true
      schema: { type: string, pattern: '^[0-9]+$' }

  responses:
    NoContent:
      description: Done; no body.
    ValidationFailed:
      description: The request breaks the contract or one of this server's limits.
      x-error-codes: [validation_failed]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SessionInvalid:
      description: The session token is not accepted (missing where required, expired, revoked, or its account disabled, suspended or deleted). The only status that signs the app out.
      x-error-codes: [session_invalid]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AccessKey:
      description: The server requires an access key and it is missing or wrong. Never signs out.
      x-error-codes: [access_key_required, access_key_invalid]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Access key problem, or the caller does not own this item.
      x-error-codes: [access_key_required, access_key_invalid, forbidden]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such item on this server.
      x-error-codes: [not_found]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    FeatureDisabled:
      description: The optional feature this route belongs to is switched off.
      x-error-codes: [feature_disabled]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFoundOrDisabled:
      description: No such item, or the optional feature this route belongs to is switched off.
      x-error-codes: [not_found, feature_disabled]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AlreadyReported:
      description: This user's earlier report on this item is still open.
      x-error-codes: [already_exists]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests; wait `Retry-After` seconds.
      x-error-codes: [rate_limited]
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: "`500 server_error` (the app retries once at most) or `503 unavailable`."
      x-error-codes: [server_error, unavailable]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # ── Primitives ──
    Id:
      description: A server-local id, never reused for another thing of the same kind.
      type: integer
      minimum: 1
      maximum: 2147483647
    Timestamp:
      description: ISO-8601 UTC with exactly three decimals and `Z`, as in sync.
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$'
    HttpsUrl:
      description: An absolute `https://` URL.
      type: string
      format: uri
      pattern: '^https://[^\s/?#]+[^\s]*$'
      maxLength: 2048
    HttpsOrigin:
      description: An `https://host[:port]` origin with no path.
      type: string
      pattern: '^https://[a-z0-9.-]+(:[0-9]{1,5})?$'
    Slug:
      description: A title's or collection's slug, unique among its kind on the server.
      type: string
      minLength: 1
      maxLength: 255
    SourceSlug:
      description: A source's slug (the same pattern as `sourceSlug` in sync).
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
    LangCode:
      description: A language code (`en`, `es`, `pt-BR`).
      type: string
      pattern: '^[a-z]{2,3}(-[A-Za-z]{2,4})?$'
    ResourceUrl:
      description: |
        An address on a source: a root-relative path (`/manga/foo/`) on the source's `website`,
        or an absolute http(s) URL, as the source's definition expects it. On the hosted source
        it is the server-relative path given by each route.
      type: string
      pattern: '^(https?://|/)'
      minLength: 2
      maxLength: 2048
    VoteValue:
      description: A vote, or `null` for none.
      type: [string, "null"]
      enum: [up, down, null]
      x-enum: closed

    # ── Errors ──
    Error:
      description: The body of every non-2xx response (except the sync pull's 409).
      type: object
      required: [code, message]
      x-may-be-absent: [fields]
      properties:
        code:
          description: "Machine-readable reason; an open enum (the app handles an unknown code by its HTTP status)."
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          x-enum: open
          x-values: [validation_failed, wrong_password, password_not_set, email_unverified, google_code_invalid, backup_invalid, session_invalid, access_key_required, access_key_invalid, account_disabled, account_suspended, forbidden, sign_up_closed, not_found, feature_disabled, already_exists, email_taken, too_large, rate_limited, server_error, unavailable]
        message:
          description: Human text in the request's `Accept-Language` when the server can; shown only when the app has no translation for `code`.
          type: string
          minLength: 1
        fields:
          description: Validation errors, one per field or query parameter.
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          description: The JSON field or query parameter name.
          type: string
          minLength: 1
        code:
          description: What is wrong with it; an open enum.
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          x-enum: open
          x-values: [required, invalid, too_short, too_long, too_small, too_large, too_many, too_few, unknown_value, not_allowed]

    # ── Server status ──
    ServerStatus:
      type: object
      required: [name, accessKeyRequired, signUpOpen, operator, contracts]
      properties:
        name:
          description: The server's display name.
          type: string
          minLength: 1
          maxLength: 80
        accessKeyRequired:
          description: Every route except this one and the Google sign-in start needs `X-Access-Key`.
          type: boolean
        signUpOpen:
          description: "`false` when the operator closed sign-up; the sign-up route then answers `403 sign_up_closed`."
          type: boolean
        operator: { $ref: "#/components/schemas/OperatorDetails" }
        contracts:
          description: One entry per contract major version the server offers.
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ContractOffer" }
    OperatorDetails:
      description: Who runs the server (core). The app shows it; the conformance check tests the shape only. There is no donation field.
      type: object
      required: [name, contact, privacyUrl, termsUrl, copyrightUrl]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        contact:
          description: A `mailto:` or `https://` URI.
          type: string
          format: uri
          pattern: '^(mailto:[^\s@]+@[^\s@]+|https://[^\s]+)$'
        privacyUrl:
          anyOf: [{ $ref: "#/components/schemas/HttpsUrl" }, { type: "null" }]
        termsUrl:
          anyOf: [{ $ref: "#/components/schemas/HttpsUrl" }, { type: "null" }]
        copyrightUrl:
          anyOf: [{ $ref: "#/components/schemas/HttpsUrl" }, { type: "null" }]
    ContractOffer:
      type: object
      required: [version, basePath, features]
      properties:
        version:
          description: The contract version `MAJOR.MINOR` the server implements for this major.
          type: string
          pattern: '^[1-9][0-9]*\.(0|[1-9][0-9]*)$'
        basePath:
          description: Where this major's routes live; `/api/v1` for major 1.
          type: string
          pattern: '^/api/v[1-9][0-9]*$'
        features:
          description: The optional features switched on (core features are implied by the version). The app ignores names it does not know.
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/FeatureName" }
    FeatureName:
      description: An optional feature's name.
      type: string
      pattern: '^[a-z][a-z0-9-]*$'
      x-enum: open
      x-values: [comments, collections, stats, reports, backup, google-sign-in, hosted-chapters]

    # ── Account ──
    Account:
      description: The signed-in account.
      type: object
      required: [id, displayName, email, avatarUrl, hasPassword]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        displayName: { type: string, minLength: 1, maxLength: 255 }
        email: { type: string, format: email }
        avatarUrl:
          anyOf: [{ $ref: "#/components/schemas/HttpsUrl" }, { type: "null" }]
        hasPassword:
          description: "`false` for an account made with Google sign-in: it signs in only with Google and is deleted with the session alone."
          type: boolean
    UserRef:
      description: Another user as others see them.
      type: object
      required: [id, displayName, avatarUrl]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        displayName: { type: string, minLength: 1, maxLength: 255 }
        avatarUrl:
          anyOf: [{ $ref: "#/components/schemas/HttpsUrl" }, { type: "null" }]
    Session:
      type: object
      required: [token, user]
      properties:
        token:
          description: "Opaque session token, sent as `Authorization: Bearer <token>`."
          type: string
          minLength: 1
        user: { $ref: "#/components/schemas/Account" }
    SignUpRequest:
      type: object
      required: [displayName, email, password]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 255 }
        email:
          description: Any syntactically valid address; never checked for deliverability.
          type: string
          format: email
          maxLength: 254
        password: { type: string, minLength: 1, maxLength: 1024 }
    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, minLength: 1, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 1024 }
    UpdateProfileRequest:
      type: object
      required: [displayName, avatarUrl]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 255 }
        avatarUrl:
          anyOf: [{ $ref: "#/components/schemas/HttpsUrl" }, { type: "null" }]
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 1024 }
        newPassword: { type: string, minLength: 1, maxLength: 1024 }
    DeleteAccountRequest:
      type: object
      required: [password]
      properties:
        password:
          description: The current password; `null` for an account without one.
          type: [string, "null"]
          maxLength: 1024

    # ── Catalog ──
    Title:
      description: One title of the catalog, merged from every source that offers it.
      type: object
      required: [id, slug, name, altNames, description, status, genres, authors, coverUrl, rating, views, langs, createdAt, updatedAt, sources, me]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, minLength: 1, maxLength: 255 }
        altNames:
          description: Other names of the title.
          type: array
          items: { type: string, minLength: 1 }
        description: { type: [string, "null"], minLength: 1 }
        status: { $ref: "#/components/schemas/TitleStatus" }
        genres:
          type: array
          items: { $ref: "#/components/schemas/GenreRef" }
        authors:
          type: array
          items: { $ref: "#/components/schemas/Author" }
        coverUrl:
          description: The cover image, or `null` when the server has none.
          anyOf: [{ $ref: "#/components/schemas/HttpsUrl" }, { type: "null" }]
        rating:
          description: The title's rating from 0 to 10, from a source of the server's choice; `null` when unrated.
          type: [number, "null"]
          minimum: 0
          maximum: 10
        views:
          description: How often the title was opened, as the server counts it.
          type: integer
          minimum: 0
        langs:
          description: The languages of its source titles.
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/LangCode" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt:
          description: When the title last changed in the catalog; `sort=latest` orders by it.
          $ref: "#/components/schemas/Timestamp"
        sources:
          description: The title's source titles. Every `sourceSlug` exists in `GET /api/v1/sources`.
          type: array
          items: { $ref: "#/components/schemas/SourceTitle" }
        me:
          description: The caller's own state; `null` when nobody is signed in.
          anyOf: [{ $ref: "#/components/schemas/MyTitleState" }, { type: "null" }]
    TitleStatus:
      description: Publication status. A server without the information sends `unknown`.
      type: string
      pattern: '^[a-z][a-z0-9_]*$'
      x-enum: open
      x-values: [unknown, ongoing, completed, licensed, publishing_finished, cancelled, on_hiatus]
    MyTitleState:
      type: object
      required: [favorite, planning, blacklist, vote]
      properties:
        favorite: { type: boolean }
        planning: { type: boolean }
        blacklist: { type: boolean }
        vote: { $ref: "#/components/schemas/VoteValue" }
    GenreRef:
      type: object
      required: [id, name, slug]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string, minLength: 1, maxLength: 255 }
        slug: { type: string, minLength: 1, maxLength: 255 }
    Genre:
      type: object
      required: [id, name, slug, titleCount]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string, minLength: 1, maxLength: 255 }
        slug: { type: string, minLength: 1, maxLength: 255 }
        titleCount:
          description: How many titles have this genre.
          type: integer
          minimum: 0
    GenreList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Genre" }
    Author:
      description: A person credited on the title.
      type: object
      required: [id, name, role]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string, minLength: 1, maxLength: 255 }
        role:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          x-enum: open
          x-values: [author, artist, unknown]
    SourceTitle:
      description: One title as one source offers it.
      type: object
      required: [id, sourceSlug, url, lang, hasDefinition, readingMode, rights]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        sourceSlug: { $ref: "#/components/schemas/SourceSlug" }
        url:
          description: Its address on the source; with the source it identifies the source title in sync, marks and backups. A hosted source title's is `/source-titles/{id}`.
          $ref: "#/components/schemas/ResourceUrl"
        lang: { $ref: "#/components/schemas/LangCode" }
        hasDefinition:
          description: "`true` only when the definitions manifest has this source's slug; always `false` on the hosted source."
          type: boolean
        readingMode:
          description: The reader's default for this source title (the user's own setting wins); hosted source titles only, `null` elsewhere.
          anyOf: [{ $ref: "#/components/schemas/ReadingMode" }, { type: "null" }]
        rights:
          description: Licence and credit facts of a hosted title; `null` when absent and on every source title that is not hosted. The app shows them and never judges them.
          anyOf: [{ $ref: "#/components/schemas/Rights" }, { type: "null" }]
    ReadingMode:
      type: string
      pattern: '^[a-z][a-z0-9_]*$'
      x-enum: open
      x-values: [paged_ltr, paged_rtl, long_strip]
    Rights:
      type: object
      required: [holder, licence, licenceUrl, attribution, changes]
      properties:
        holder: { type: [string, "null"], minLength: 1 }
        licence:
          description: Free text, for example "CC BY 4.0".
          type: [string, "null"]
          minLength: 1
        licenceUrl:
          anyOf: [{ $ref: "#/components/schemas/HttpsUrl" }, { type: "null" }]
        attribution: { type: [string, "null"], minLength: 1 }
        changes:
          description: The "modified" note.
          type: [string, "null"]
          minLength: 1
    TitleSort:
      type: string
      enum: [latest, popular, trending, alphabetical]
      default: latest
      x-enum: closed
    LibraryList:
      description: A library list, named like the sync kinds.
      type: string
      enum: [favorite, planning, blacklist]
      x-enum: closed
    TitlesPage:
      type: object
      required: [items, page, size, totalItems, hasMore]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Title" }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
        hasMore: { type: boolean }

    # ── Sources and definitions ──
    Source:
      type: object
      required: [slug, name, iconUrl, lang, website, hosted]
      properties:
        slug: { $ref: "#/components/schemas/SourceSlug" }
        name: { type: string, minLength: 1, maxLength: 255 }
        iconUrl:
          anyOf: [{ $ref: "#/components/schemas/HttpsUrl" }, { type: "null" }]
        lang: { $ref: "#/components/schemas/LangCode" }
        website:
          description: The source website, which identifies the source across servers (compared by host, `www.` ignored). The hosted source's is the server's own origin.
          $ref: "#/components/schemas/HttpsOrigin"
        hosted:
          description: "`true` only for the hosted source: the server itself, which stores its chapters and pages."
          type: boolean
    SourceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Source" }
    Base64Ed25519PublicKey:
      description: A raw 32-byte Ed25519 public key, standard base64 with padding.
      type: string
      pattern: '^[A-Za-z0-9+/]{43}=$'
    Base64Ed25519Signature:
      description: A raw 64-byte Ed25519 signature, standard base64 with padding.
      type: string
      pattern: '^[A-Za-z0-9+/]{86}==$'
    KeyId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9._-]+$'
    DefinitionKey:
      type: object
      required: [keyId, publicKey, endorsement]
      properties:
        keyId: { $ref: "#/components/schemas/KeyId" }
        publicKey: { $ref: "#/components/schemas/Base64Ed25519PublicKey" }
        endorsement:
          description: Signature by an already pinned key that lets the app pin this one; `null` when there is none.
          anyOf: [{ $ref: "#/components/schemas/KeyEndorsement" }, { type: "null" }]
    KeyEndorsement:
      type: object
      required: [byKeyId, signature]
      properties:
        byKeyId: { $ref: "#/components/schemas/KeyId" }
        signature: { $ref: "#/components/schemas/Base64Ed25519Signature" }
    DefinitionKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DefinitionKey" }
    Sha256Hex:
      type: string
      pattern: '^[0-9a-f]{64}$'
    ManifestEntry:
      type: object
      required: [sourceSlug, definitionVersion, contentHash, signature, keyId, minAppVersion, revoked]
      properties:
        sourceSlug: { $ref: "#/components/schemas/SourceSlug" }
        definitionVersion: { type: integer, minimum: 1 }
        contentHash:
          description: SHA-256 of the definition's content; `null` on a revoked entry.
          anyOf: [{ $ref: "#/components/schemas/Sha256Hex" }, { type: "null" }]
        signature: { $ref: "#/components/schemas/Base64Ed25519Signature" }
        keyId: { $ref: "#/components/schemas/KeyId" }
        minAppVersion:
          description: The definition's own gate (separate from contract versions); `null` when it has none.
          type: [string, "null"]
          pattern: '^[0-9]{1,9}\.[0-9]{1,9}\.[0-9]{1,9}$'
        revoked: { type: boolean }
    DefinitionManifest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ManifestEntry" }
    DefinitionContent:
      type: object
      required: [content, contentHash, signature, keyId, definitionVersion]
      properties:
        content:
          description: The definition's JSON text (at most 2 MB).
          type: string
          minLength: 2
          maxLength: 2097152
        contentHash: { $ref: "#/components/schemas/Sha256Hex" }
        signature: { $ref: "#/components/schemas/Base64Ed25519Signature" }
        keyId: { $ref: "#/components/schemas/KeyId" }
        definitionVersion: { type: integer, minimum: 1 }
    DefinitionHealthReport:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/DefinitionHealthItem" }
    DefinitionHealthItem:
      type: object
      required: [definitionVersion, errorKind, count]
      properties:
        definitionVersion: { type: integer, minimum: 1 }
        errorKind:
          description: The kind of error; an open enum, and a server accepts any snake_case value.
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          x-enum: open
          x-values: [network, cloudflare, selector_miss, parse, decrypt, outdated, rate_limited, signature_invalid, version_rollback]
        count: { type: integer, minimum: 1 }

    # ── Comments ──
    MyVote:
      type: object
      required: [vote]
      properties:
        vote: { $ref: "#/components/schemas/VoteValue" }
    VoteRequest:
      type: object
      required: [vote]
      properties:
        vote: { $ref: "#/components/schemas/VoteValue" }
    Comment:
      description: A comment on a title, or a reply to one.
      type: object
      required: [id, titleId, parentId, text, imageUrl, spoiler, author, upvotes, downvotes, replyCount, createdAt, updatedAt, me]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        titleId: { $ref: "#/components/schemas/Id" }
        parentId:
          description: The top-level comment this replies to; `null` on a top-level comment.
          anyOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }]
        text: { type: string, minLength: 1 }
        imageUrl:
          anyOf: [{ $ref: "#/components/schemas/HttpsUrl" }, { type: "null" }]
        spoiler: { type: boolean }
        author: { $ref: "#/components/schemas/UserRef" }
        upvotes: { type: integer, minimum: 0 }
        downvotes: { type: integer, minimum: 0 }
        replyCount:
          description: Replies to it (always 0 on a reply).
          type: integer
          minimum: 0
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        me:
          description: The caller's vote; `null` when nobody is signed in.
          anyOf: [{ $ref: "#/components/schemas/MyVote" }, { type: "null" }]
    CommentRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 10000 }
        imageUrl:
          description: An image to show with it; a server may limit the hosts.
          anyOf: [{ $ref: "#/components/schemas/HttpsUrl" }, { type: "null" }]
        spoiler: { type: boolean, default: false }
    CommentSort:
      type: string
      enum: [latest, popular]
      default: latest
      x-enum: closed
    ReplySort:
      type: string
      enum: [latest]
      default: latest
      x-enum: closed
    ReplyOrder:
      type: string
      enum: [asc, desc]
      default: asc
      x-enum: closed
    CommentsPage:
      type: object
      required: [items, page, size, totalItems, hasMore]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Comment" }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
        hasMore: { type: boolean }
    ReportDetails:
      description: Free text for the server operator, at most 500 characters; `null` or absent for none.
      type: [string, "null"]
      minLength: 1
      maxLength: 500
    CommentReportRequest:
      type: object
      required: [reason]
      properties:
        reason: { $ref: "#/components/schemas/CommentReportReason" }
        details: { $ref: "#/components/schemas/ReportDetails" }
    CommentReportReason:
      description: Why a comment or reply is reported.
      type: string
      pattern: '^[a-z][a-z0-9_]*$'
      x-enum: open
      x-values: [spam, harassment_or_hate, sexual_content, illegal_content, spoiler, other]

    # ── Collections ──
    Collection:
      description: A user's public list of titles.
      type: object
      required: [id, slug, name, description, owner, titleCount, commentCount, upvotes, downvotes, views, coverUrls, createdAt, updatedAt, me]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: [string, "null"], minLength: 1 }
        owner: { $ref: "#/components/schemas/UserRef" }
        titleCount: { type: integer, minimum: 0 }
        commentCount: { type: integer, minimum: 0 }
        upvotes: { type: integer, minimum: 0 }
        downvotes: { type: integer, minimum: 0 }
        views: { type: integer, minimum: 0 }
        coverUrls:
          description: Covers of its first titles, for a preview (at most 10).
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/HttpsUrl" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        me:
          description: The caller's vote; `null` when nobody is signed in.
          anyOf: [{ $ref: "#/components/schemas/MyVote" }, { type: "null" }]
    CollectionRequest:
      type: object
      required: [name, titleIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description:
          type: [string, "null"]
          minLength: 1
          maxLength: 10000
        titleIds:
          description: The titles, in the collection's order.
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Id" }
    CollectionSort:
      type: string
      enum: [latest, popular, trending, alphabetical]
      default: latest
      x-enum: closed
    CollectionTitleSort:
      type: string
      enum: [added, latest, popular, trending, alphabetical]
      default: added
      x-enum: closed
    CollectionsPage:
      type: object
      required: [items, page, size, totalItems, hasMore]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Collection" }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
        hasMore: { type: boolean }
    CollectionReportRequest:
      type: object
      required: [reason]
      properties:
        reason: { $ref: "#/components/schemas/CollectionReportReason" }
        details: { $ref: "#/components/schemas/ReportDetails" }
    CollectionReportReason:
      description: Why a collection is reported.
      type: string
      pattern: '^[a-z][a-z0-9_]*$'
      x-enum: open
      x-values: [spam, harassment_or_hate, sexual_content, illegal_content, broken_titles, duplicate_titles, other]
    CollectionComment:
      description: A comment on a collection, or a reply to one.
      type: object
      required: [id, collectionId, parentId, text, imageUrl, spoiler, author, upvotes, downvotes, replyCount, createdAt, updatedAt, me]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        collectionId: { $ref: "#/components/schemas/Id" }
        parentId:
          description: The top-level comment this replies to; `null` on a top-level comment.
          anyOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }]
        text: { type: string, minLength: 1 }
        imageUrl:
          anyOf: [{ $ref: "#/components/schemas/HttpsUrl" }, { type: "null" }]
        spoiler: { type: boolean }
        author: { $ref: "#/components/schemas/UserRef" }
        upvotes: { type: integer, minimum: 0 }
        downvotes: { type: integer, minimum: 0 }
        replyCount: { type: integer, minimum: 0 }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        me:
          anyOf: [{ $ref: "#/components/schemas/MyVote" }, { type: "null" }]
    CollectionCommentsPage:
      type: object
      required: [items, page, size, totalItems, hasMore]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CollectionComment" }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
        hasMore: { type: boolean }

    # ── Stats ──
    UserStats:
      description: |
        The caller's statistics. Vocabulary as everywhere in the contract: a **vote** is up or
        down (on a title, comment or collection); `planning` is the library list.
      type: object
      required: [titlesRead, lastReadAt, currentStreakDays, longestStreakDays, favoriteCount, planningCount, blacklistCount, titleVotesGiven, titleUpvotesGiven, titleDownvotesGiven, commentsPosted, commentUpvotesGiven, commentDownvotesGiven, commentUpvotesReceived, commentDownvotesReceived, collectionsCreated, collectionTitles, collectionCommentsPosted, collectionCommentUpvotesGiven, collectionCommentDownvotesGiven, collectionCommentUpvotesReceived, collectionCommentDownvotesReceived, collectionVotesGiven, collectionVotesReceived, reportsSubmitted, genresInteracted, lastAggregatedAt, topGenres]
      properties:
        titlesRead: { type: integer, minimum: 0, description: Distinct titles the user read. }
        lastReadAt:
          anyOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }]
        currentStreakDays: { type: integer, minimum: 0, description: "Days in a row with reading, up to today." }
        longestStreakDays: { type: integer, minimum: 0 }
        favoriteCount: { type: integer, minimum: 0, description: Titles on the favorite list. }
        planningCount: { type: integer, minimum: 0, description: Titles on the planning list. }
        blacklistCount: { type: integer, minimum: 0, description: Titles on the blacklist. }
        titleVotesGiven: { type: integer, minimum: 0, description: Votes on titles (up and down). }
        titleUpvotesGiven: { type: integer, minimum: 0 }
        titleDownvotesGiven: { type: integer, minimum: 0 }
        commentsPosted: { type: integer, minimum: 0, description: Title comments and replies. }
        commentUpvotesGiven: { type: integer, minimum: 0 }
        commentDownvotesGiven: { type: integer, minimum: 0 }
        commentUpvotesReceived: { type: integer, minimum: 0 }
        commentDownvotesReceived: { type: integer, minimum: 0 }
        collectionsCreated: { type: integer, minimum: 0 }
        collectionTitles: { type: integer, minimum: 0, description: Titles across the user's collections. }
        collectionCommentsPosted: { type: integer, minimum: 0 }
        collectionCommentUpvotesGiven: { type: integer, minimum: 0 }
        collectionCommentDownvotesGiven: { type: integer, minimum: 0 }
        collectionCommentUpvotesReceived: { type: integer, minimum: 0 }
        collectionCommentDownvotesReceived: { type: integer, minimum: 0 }
        collectionVotesGiven: { type: integer, minimum: 0, description: Votes on collections. }
        collectionVotesReceived: { type: integer, minimum: 0, description: Votes on the user's collections. }
        reportsSubmitted: { type: integer, minimum: 0, description: Reports of every kind. }
        genresInteracted: { type: integer, minimum: 0, description: Distinct genres of the titles the user read. }
        lastAggregatedAt:
          description: When the server last computed these counters; `null` before the first run.
          anyOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }]
        topGenres:
          description: The user's most read genres, most read first.
          type: array
          items: { $ref: "#/components/schemas/GenreCount" }
    GenreCount:
      type: object
      required: [id, name, count]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string, minLength: 1, maxLength: 255 }
        count: { type: integer, minimum: 0 }
    RankingPeriod:
      type: string
      enum: [monthly, overall]
      x-enum: closed
    RankingSort:
      type: string
      enum: [popular, alphabetical]
      default: popular
      x-enum: closed
    Ranking:
      type: object
      required: [rank, user, points]
      properties:
        rank:
          description: 1-based position by points in the period.
          type: integer
          minimum: 1
        user: { $ref: "#/components/schemas/UserRef" }
        points: { type: integer, minimum: 0 }
    RankingsPage:
      type: object
      required: [items, page, size, totalItems, hasMore]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Ranking" }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
        hasMore: { type: boolean }

    # ── Reports ──
    TitleReportRequest:
      description: The same shape as comment and collection reports (owner decision 2026-11-19).
      type: object
      required: [reason]
      properties:
        reason: { $ref: "#/components/schemas/TitleReportReason" }
        details: { $ref: "#/components/schemas/ReportDetails" }
    TitleReportReason:
      description: Why a title is reported. One value per report.
      type: string
      pattern: '^[a-z][a-z0-9_]*$'
      x-enum: open
      x-values: [wrong_information, wrong_source, chapter_not_working, other]

    # ── Backup ──
    BackupUpload:
      type: object
      required: [file]
      properties:
        file:
          description: The backup file (gzip or raw protobuf; any file name).
          type: string
          contentMediaType: application/octet-stream
    BackupRestoreReport:
      type: object
      required: [titles, chapterMarks, unmatched]
      properties:
        titles:
          type: object
          required: [matched, matchedByName, unmatched]
          properties:
            matched: { type: integer, minimum: 0, description: Entries matched by source website or numeric id + URL. }
            matchedByName: { type: integer, minimum: 0, description: Entries matched only by a unique name (library list only). }
            unmatched: { type: integer, minimum: 0 }
        chapterMarks:
          type: object
          required: [restored, skipped]
          properties:
            restored: { type: integer, minimum: 0 }
            skipped: { type: integer, minimum: 0 }
        unmatched:
          description: The unmatched entries, at most 500.
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/UnmatchedBackupEntry" }
    UnmatchedBackupEntry:
      type: object
      required: [title, sourceName]
      properties:
        title: { type: string }
        sourceName:
          description: From the file's `backupSources`; `null` when the file does not name the source.
          type: [string, "null"]

    # ── Google sign-in ──
    GoogleTokenRequest:
      type: object
      required: [code, codeVerifier]
      properties:
        code: { type: string, minLength: 1, maxLength: 512 }
        codeVerifier:
          description: The PKCE verifier (RFC 7636).
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'

    # ── Hosted chapters ──
    Chapter:
      type: object
      required: [id, url, number, name, volume, publishedAt, pageCount, credits]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        url:
          description: "`/chapters/{id}`, server-relative; with the hosted source it is the chapter's identity for marks, history and sync."
          type: string
          pattern: '^/chapters/[1-9][0-9]{0,9}$'
        number: { type: [number, "null"], minimum: 0 }
        name: { type: [string, "null"], minLength: 1, maxLength: 1000 }
        volume: { type: [number, "null"], minimum: 0 }
        publishedAt: { $ref: "#/components/schemas/Timestamp" }
        pageCount: { type: integer, minimum: 1 }
        credits:
          description: Who made or translated this chapter, as free text; `null` when absent.
          type: [string, "null"]
          minLength: 1
    ChapterSort:
      type: string
      enum: [number]
      default: number
      x-enum: closed
    ChaptersPage:
      type: object
      required: [items, page, size, totalItems, hasMore]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Chapter" }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
        hasMore: { type: boolean }
    PageImage:
      type: object
      required: [index, imageUrl, width, height]
      properties:
        index:
          description: 0-based position in the chapter.
          type: integer
          minimum: 0
        imageUrl: { $ref: "#/components/schemas/HttpsUrl" }
        width: { type: integer, minimum: 1, maximum: 2000 }
        height: { type: integer, minimum: 1, maximum: 6000 }
    PageImageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PageImage" }
